<!doctype html>
<html lang="en" data-theme="%seq.theme%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%site.logo%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%site.description%" />
    <link rel="preload" href="%sveltekit.assets%/assets/fonts/minecraft-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/assets/fonts/minecraft-bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>%site.title%</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="root" style="display:contents">%sveltekit.body%</div>
  </body>
</html>
