# Bun loads bunfig.toml from the current directory only, so frontend keeps
# its own [run] policy for app tooling.

[run]
# Keep Node available for the root Vitest command. Frontend Bun scripts
# retain their own Bun alias for app tooling in frontend/bunfig.toml.
bun = false

[install]
# pnpm-style strict, symlinked node_modules (no phantom dependencies).
linker = "isolated"
# Supply-chain cooldown: only install versions published >= 1 day ago.
# (pnpm minimumReleaseAge was 1440 minutes; bun's unit is seconds.)
minimumReleaseAge = 86400
