name: Website backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_USE_CURL: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: aqua:rust-lang/rustup
          cache_key_prefix: mise-backend
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned rustup and the Rust toolchain
        run: |
          set -euo pipefail
          mise run setup:rust --replace-rustup
          rustup --version | grep -E '^rustup 1\.29\.2 '
          printf '%s\n' "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: mise run fmt:backend
      - name: Check and lint backend
        run: mise run clippy:backend
      - name: Test backend
        run: mise run test:backend
      - name: Test backend against PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
        run: mise run test:integration

  image:
    name: Backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --file backend/Dockerfile --tag sequoia-web-backend:ci .
      - name: Smoke-test production image
        run: |
          set -euo pipefail
          docker run --detach --name ci-postgres --network host \
            --env POSTGRES_PASSWORD=ci-only --env POSTGRES_DB=tracker \
            postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          for _ in $(seq 1 60); do
            docker exec ci-postgres pg_isready --quiet --username postgres --dbname tracker && break
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/wynn/guild/prefix"
          cat > "$RUNNER_TEMP/wynn/guild/prefix/SEQ" <<'JSON'
          {"uuid":"0f2f6f50-4a56-4ebd-aef7-a22a4cf8fd53","name":"Sequoia","prefix":"SEQ","members":{"total":1,"chief":{"070af99c-cd21-4923-92e4-8809b3d99f0d":{"username":"StubMember","online":false,"joined":"2025-08-08T22:29:03.502000Z","globalData":{"guildRaids":{"total":7000,"list":{}},"currentGuildRaids":{"total":6760,"list":{}}}}}}}
          JSON
          python3 -m http.server 8099 --bind 127.0.0.1 --directory "$RUNNER_TEMP/wynn" > "$RUNNER_TEMP/wynn.log" 2>&1 &
          docker run --detach --name sequoia-web-backend --network host \
            --env DATABASE_URL=postgres://postgres:ci-only@127.0.0.1:5432/tracker \
            --env BIND_ADDR=127.0.0.1:8080 \
            --env WYNN_API_BASE_URL=http://127.0.0.1:8099 \
            --env WYNNCRAFT_ACCESS_TOKEN=ci-stub \
            sequoia-web-backend:ci
          test "$(docker inspect --format '{{.Config.User}}' sequoia-web-backend)" = 10001:10001
          test "$(docker exec sequoia-web-backend id -u)" = 10001
          for _ in $(seq 1 90); do
            test "$(docker inspect --format '{{.State.Health.Status}}' sequoia-web-backend)" = healthy && break
            sleep 1
          done
          docker logs sequoia-web-backend 2>&1 | tail -n 20
          test "$(docker inspect --format '{{.State.Health.Status}}' sequoia-web-backend)" = healthy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/health
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/ready \
            | jq --exit-status '.status == "ready" and .poller.last_success_age_secs != null'
          started=$(date +%s)
          docker stop --time 20 sequoia-web-backend
          test "$(docker inspect --format '{{.State.ExitCode}}' sequoia-web-backend)" = 0
          test $(( $(date +%s) - started )) -lt 10
