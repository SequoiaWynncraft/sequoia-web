name: Website backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/**"
      - "package.json"
      - "bunfig.toml"
      - "mise.toml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/**"
      - "package.json"
      - "bunfig.toml"
      - "mise.toml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_USE_CURL: "1"
    # The tracker's retention tests run against a real database of their own.
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Install pinned rustup 1.29.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) rustup_sha=5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4 ;;
            aarch64) rustup_sha=a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697 ;;
            *) exit 1 ;;
          esac
          installer="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -o "$installer" "https://static.rust-lang.org/rustup/archive/1.29.2/$(uname -m)-unknown-linux-gnu/rustup-init"
          printf '%s  %s\n' "$rustup_sha" "$installer" | sha256sum -c -
          chmod +x "$installer"
          "$installer" -y --no-modify-path --default-toolchain none
          rm "$installer"
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup --version | grep -E '^rustup 1\.29\.2 '
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: bun run fmt:backend
      - name: Check and lint backend
        run: bun run clippy:backend
      - name: Test backend
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
        run: cargo test --locked --manifest-path backend/Cargo.toml --workspace --all-features -- --include-ignored
