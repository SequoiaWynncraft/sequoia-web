name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "scripts/audit-lockfile.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "scripts/audit-lockfile.mjs"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.4-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit lockfile
        run: bun run check:lockfile
      - name: Check dependency advisories
        run: bun run check:advisories
      - name: Check frontend
        run: bun run check:web
      - name: Test frontend
        run: bun run test:web
      - name: Build frontend
        run: bun run build:web
      - name: Save dependency cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    name: Frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --file frontend/Dockerfile --tag sequoia-web:ci .
      - name: Smoke-test production image
        run: |
          set -euo pipefail
          docker run --detach --name sequoia-web --publish 127.0.0.1:3000:3000 sequoia-web:ci
          test "$(docker inspect --format '{{.Config.User}}' sequoia-web)" = 10001:10001
          test "$(docker exec sequoia-web id -u)" = 10001
          for _ in $(seq 1 60); do
            test "$(docker inspect --format '{{.State.Health.Status}}' sequoia-web)" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' sequoia-web)" = healthy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/healthz
          docker exec sequoia-web bun -e 'const { createClient } = await import("@libsql/client"); const result = await createClient({ url: "file:/app/frontend/.data/smoke.db" }).execute("select 1 as ok"); if (result.rows[0].ok !== 1) process.exit(1)'
          docker exec sequoia-web rm /app/frontend/.data/smoke.db
          if docker exec sequoia-web touch /app/frontend/server.js; then
            echo "the runtime user can modify application files" >&2
            exit 1
          fi
          installed="$(docker exec sequoia-web ls /app/node_modules/.bun)"
          if grep -E '^(vite|vitest|svelte-check|typescript|@sveltejs\+kit|deepmerge|minimatch)@' <<<"$installed"; then
            echo "development packages shipped in the runtime image" >&2
            exit 1
          fi
          docker stop --time 20 sequoia-web
          test "$(docker inspect --format '{{.State.ExitCode}}' sequoia-web)" = 0
