name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "scripts/audit-lockfile.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "scripts/audit-lockfile.mjs"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.4-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit lockfile
        run: bun run check:lockfile
      - name: Check dependency advisories
        run: bun run check:advisories
      - name: Check frontend
        run: bun run check:web
      - name: Test frontend
        run: bun run test:web
      - name: Build frontend
        run: bun run build:web
      - name: Save dependency cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --file frontend/Dockerfile --tag sequoia-web:ci .
      - name: Smoke-test production image
        run: |
          set -euo pipefail
          docker run --detach --name sequoia-web --publish 127.0.0.1:3000:3000 sequoia-web:ci
          for _ in $(seq 1 30); do
            curl --fail --silent --max-time 2 --output /dev/null http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/healthz
          # STOPSIGNAL is SIGUSR2: the app must drain and exit cleanly, not be killed.
          docker stop --time 20 sequoia-web
          test "$(docker inspect --format '{{.State.ExitCode}}' sequoia-web)" = 0
