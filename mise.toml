min_version = { hard = "2026.10.17" }

[settings]
locked = true

[tools]
bun = "1.4.4"
node = "26.13.0"
# rust-toolchain.toml owns the Rust version and components; this pins the
# rustup installer used when no rustup is present.
"aqua:rust-lang/rustup" = "1.29.2"

[env]
_.path = ["{{ env.CARGO_HOME | default(value=env.HOME ~ '/.cargo') }}/bin"]

[tasks.setup]
description = "Install locked dependencies and the Rust toolchain; create frontend/.env if absent"
depends = ["deps:web", "setup:rust"]
run = '[ -e frontend/.env ] || [ -L frontend/.env ] || cp frontend/.env.example frontend/.env'

[tasks."deps:web"]
description = "Install locked frontend dependencies"
run = "bun install --frozen-lockfile"

[tasks."setup:rust"]
description = "Install the Rust toolchain from rust-toolchain.toml"
usage = 'flag "--replace-rustup" help="Reinstall rustup with the locked installer even if one exists"'
run = '''
if [ "${usage_replace_rustup:-false}" = true ] || ! command -v rustup >/dev/null; then
  rustup-init -y --no-modify-path --default-toolchain none
fi
rustup --version
rustup toolchain install
'''

[tasks.dev]
description = "Run the website dev server"
depends = ["deps:web"]
dir = "frontend"
run = "bun run dev"

[tasks."check:lockfile"]
depends = ["deps:web"]
run = "bun scripts/audit-lockfile.mjs"

[tasks."check:advisories"]
depends = ["deps:web"]
run = "bun audit --ignore=GHSA-g3hv-75wg-m249 --ignore=GHSA-gcqx-w48m-w2h4"

[tasks."check:web"]
depends = ["deps:web"]
dir = "frontend"
run = "node --run check"

[tasks."fmt:backend"]
depends = ["setup:rust"]
run = "cargo fmt --manifest-path backend/Cargo.toml --all --check"

[tasks."clippy:backend"]
depends = ["setup:rust"]
run = "cargo clippy --locked --manifest-path backend/Cargo.toml --workspace --all-targets --all-features -- -D warnings"

[tasks.check]
description = "Run every lint, type and dependency check"
depends = ["check:lockfile", "check:advisories", "check:web", "fmt:backend", "clippy:backend"]

[tasks."test:web"]
depends = ["deps:web"]
dir = "frontend"
run = "bun run test:unit"

[tasks."test:backend"]
description = "Run backend tests that need no database"
depends = ["setup:rust"]
run = "cargo test --locked --manifest-path backend/Cargo.toml --workspace --all-features"

[tasks."test:integration"]
description = "Run the backend PostgreSQL tests against TEST_DATABASE_URL"
depends = ["setup:rust"]
run = '''
if [ -z "${TEST_DATABASE_URL:-}" ]; then
  echo "test:integration: set TEST_DATABASE_URL to a disposable PostgreSQL server, e.g. postgres://user:password@127.0.0.1:5432/postgres; each test creates and drops its own database" >&2
  exit 2
fi
cargo test --locked --manifest-path backend/Cargo.toml --workspace --all-features -- --ignored
'''

[tasks.test]
description = "Run the frontend and backend unit tests"
depends = ["test:web", "test:backend"]

[tasks."build:web"]
depends = ["deps:web"]
dir = "frontend"
run = "bun run build"

[tasks."build:backend"]
depends = ["setup:rust"]
run = "cargo build --locked --manifest-path backend/Cargo.toml --workspace --all-features"

[tasks.build]
depends = ["build:web", "build:backend"]

[tasks."api:types"]
description = "Generate frontend API types from sequoia-backend's OpenAPI schema"
depends = ["deps:web"]
usage = '''
arg "[schema]" default="../sequoia-backend/openapi/public.yaml" help="Path to public.yaml"
flag "--check" help="Fail if the generated file is out of date instead of writing it"
'''
run = '''
if [ ! -f "$usage_schema" ]; then
  echo "api:types: no schema at $usage_schema; check out sequoia-backend next to this repository or pass the path" >&2
  exit 1
fi
frontend/node_modules/.bin/openapi-typescript "$usage_schema" -o frontend/src/lib/api/generated/public-api.ts ${usage_check:+--check}
'''
